version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: mfp-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # Optional: expose Redis port for debugging (remove in production)
    # ports:
    #   - '6379:6379'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mediaflow-proxy:
    # Use local build to include 4K optimizations (chunk size, pre-buffer defaults)
    build: .
    image: mediaflow-proxy:local
    container_name: mediaflow-proxy
    restart: always
    ports:
      - "8888:8000"
    environment:
      # Security & Access
      - API_PASSWORD=l0v3lY5p1d3r5
      - REDIS_URL=redis://redis:6379

      # Logic: Workers should be (2 * Cores) + 1. 
      # For a 2-core VPS, use 5. For 4-core, use 9.
      - WORKERS=5
      - LOG_LEVEL=INFO

      # PREMIUM FEATURE: HLS/DASH Pre-buffering
      # Defaults are True in code, but explicit is good.
      - ENABLE_HLS_PREBUFFER=true
      - HLS_PREBUFFER_SEGMENTS=8 # Increased safety net for 4K (default 5)
      - ENABLE_DASH_PREBUFFER=true

      # IP TRUST: Tell Mediaflow to trust Caddy's headers
      # - FORWARDED_ALLOW_IPS=caddy
      - FORWARDED_ALLOW_IPS=*

      - M3U8_CONTENT_ROUTING=mediaflow
      # Defaults from code logic (optional to override here):
      # - STREAM_CHUNK_SIZE=1048576

      - PORT=8000

    networks:
      - media-net
      - ai_network

    depends_on:
      redis:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

networks:
  media-net:
    driver: bridge
  ai_network:
    external: true

volumes:
  redis_data:
