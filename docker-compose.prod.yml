services:
  mediaflow-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: mediaflow-proxy:prod
    container_name: mediaflow-proxy
    restart: unless-stopped
    ports:
      - "${PORT:-8888}:8000"
    environment:
      - PORT=8000
      - API_PASSWORD=${API_PASSWORD}
      - FORWARDED_ALLOW_IPS=*
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health').getcode())" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai_network

networks:
  ai_network:
    external: true
