name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install poetry
      run: |
        pipx install poetry
    - name: Install dependencies
      run: |
        poetry install --with dev
    - name: Run Ruff
      run: |
        poetry run ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install poetry
      run: |
        pipx install poetry
    - name: Install dependencies
      run: |
        poetry install --with dev
    - name: Run Tests
      run: |
        poetry run pytest --cov=mediaflow_proxy --cov-report=xml
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: mhdzumair/mediaflow-proxy
