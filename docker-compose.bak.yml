version: '3.8'

services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - media-net
      - ai_network

  mediaflow-proxy:
    # Use local build to include 4K optimizations (chunk size, pre-buffer defaults)
    build: .
    image: mediaflow-proxy:local
    container_name: mediaflow-proxy
    restart: always
    ports:
      - "8888:8000"
    environment:
      # Security & Access
      - API_PASSWORD=mfp

      # Logic: Workers should be (2 * Cores) + 1. 
      # For a 2-core VPS, use 5. For 4-core, use 9.
      - WORKERS=5
      - LOG_LEVEL=error

      # PREMIUM FEATURE: HLS/DASH Pre-buffering
      # Defaults are True in code, but explicit is good.
      - ENABLE_HLS_PREBUFFER=true
      - HLS_PREBUFFER_SEGMENTS=8 # Increased safety net for 4K (default 5)
      - ENABLE_DASH_PREBUFFER=true

      # IP TRUST: Tell Mediaflow to trust Caddy's headers
      # - FORWARDED_ALLOW_IPS=caddy

      - M3U8_CONTENT_ROUTING=mediaflow
      # Defaults from code logic (optional to override here):
      # - STREAM_CHUNK_SIZE=1048576

      - PORT=8000

    networks:
      - media-net
      - ai_network

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

networks:
  media-net:
    driver: bridge
  ai_network:
    external: true

volumes:
  caddy_data:
  caddy_config:
